schema_version: "1.0"
id: deck.slide-count
scope: deck
tier: 1
title: Slide count matches target
description: The submission must contain exactly 20 slides for Level 3 (checked per-tier).
kind: structure
severity: critical
source_of_truth: ooxml
verification:
  method: object_compare
  selector: slide_count
  expectation:
    exact_count: 20
---
schema_version: "1.0"
id: deck.master-present
scope: deck
tier: 1
title: At least one slide master defined
description: The deck must define at least one slide master for layout inheritance.
kind: master-layout
severity: critical
source_of_truth: ooxml
verification:
  method: layout_check
  selector: master_count
  expectation:
    min_count: 1
---
schema_version: "1.0"
id: deck.layouts-defined
scope: deck
tier: 1
title: Multiple slide layouts defined
description: The deck should define multiple layouts for varied slide types.
kind: master-layout
severity: major
source_of_truth: ooxml
verification:
  method: layout_check
  selector: layout_count
  expectation:
    min_count: 2
---
schema_version: "1.0"
id: deck.font-policy
scope: deck
tier: 1
title: All fonts in bundled set
description: Every font referenced in the deck must be from the bundled libre font set (Noto, Liberation, Carlito, Caladea). Non-bundled fonts trigger auto-fail per §4.3.
kind: structure
severity: critical
source_of_truth: ooxml
verification:
  method: anti_cheat
  selector: font_policy
failure_mode:
  automatic_fail_if:
    - non_bundled_font_used
  propagation: zero_affected_slides
---
schema_version: "1.0"
id: deck.has-embedded-media
scope: deck
tier: 1
title: Deck contains embedded media
description: The deck must contain at least one embedded image/media asset.
kind: image-asset
severity: major
source_of_truth: ooxml
verification:
  method: hash_match
