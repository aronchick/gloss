schema_version: "1.0"
id: slide-20.native-chart
scope: slide
slide: 20
tier: 3
title: Native chart present
description: Final torture slide must contain a native chart.
kind: chart
severity: critical
source_of_truth: ooxml
verification:
  method: object_compare
  selector: chart
  expectation:
    exact_count: 1
    required: true
failure_mode:
  automatic_fail_if:
    - raster_image_used_as_chart
  propagation: zero_slide
