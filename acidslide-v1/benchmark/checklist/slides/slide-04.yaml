schema_version: "1.0"
id: slide-04.native-chart-required
scope: slide
slide: 4
tier: 1
title: Native chart required
description: Slide 4 must contain exactly one native OOXML chart (<c:chart> with embedded xlsx).
kind: chart
severity: critical
source_of_truth: ooxml
verification:
  method: object_compare
  selector: chart
  expectation:
    exact_count: 1
    required: true
failure_mode:
  automatic_fail_if:
    - raster_image_used_as_chart
    - shapes_used_as_chart
  propagation: zero_slide
---
schema_version: "1.0"
id: slide-04.title-placeholder
scope: slide
slide: 4
tier: 1
title: Title placeholder present
description: Slide 4 must use a native title placeholder.
kind: master-layout
severity: critical
source_of_truth: ooxml
verification:
  method: layout_check
  selector: placeholder
  expectation:
    placeholder_type: title
    min_count: 1
---
schema_version: "1.0"
id: slide-04.callout-shapes
scope: slide
slide: 4
tier: 1
title: Overlaid callout shapes
description: Chart slide should have callout annotation shapes overlaid on or near the chart.
kind: structure
severity: minor
source_of_truth: ooxml
verification:
  method: object_compare
  selector: shape
  expectation:
    min_count: 1
---
schema_version: "1.0"
id: slide-04.font-policy
scope: slide
slide: 4
tier: 1
title: Font policy compliance
description: All fonts on slide 4 must be from the bundled set.
kind: structure
severity: critical
source_of_truth: ooxml
verification:
  method: anti_cheat
  selector: font_policy
failure_mode:
  automatic_fail_if:
    - non_bundled_font_used
  propagation: zero_slide
