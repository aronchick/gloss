schema_version: "1.0"
id: slide-15.font-policy
scope: slide
slide: 15
tier: 3
title: Font policy compliance
description: All fonts on slide 15 must be from the bundled set.
kind: structure
severity: critical
source_of_truth: ooxml
verification:
  method: anti_cheat
  selector: font_policy
failure_mode:
  automatic_fail_if:
    - non_bundled_font_used
  propagation: zero_slide
