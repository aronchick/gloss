schema_version: "1.0"
id: slide-01.title-placeholder
scope: slide
slide: 1
tier: 1
title: Title placeholder present
description: Slide 1 must use a native title placeholder (<p:ph type="title">), not a freestanding text box.
kind: master-layout
severity: critical
source_of_truth: ooxml
verification:
  method: layout_check
  selector: placeholder
  expectation:
    placeholder_type: title
    min_count: 1
---
schema_version: "1.0"
id: slide-01.subtitle-placeholder
scope: slide
slide: 1
tier: 1
title: Subtitle or body placeholder present
description: Slide 1 cover must have a subtitle/body placeholder for the secondary text.
kind: master-layout
severity: critical
source_of_truth: ooxml
verification:
  method: layout_check
  selector: placeholder
  expectation:
    placeholder_type: subTitle
    min_count: 1
---
schema_version: "1.0"
id: slide-01.hero-image
scope: slide
slide: 1
tier: 1
title: Hero image present
description: Slide 1 must contain exactly one precisely cropped hero image.
kind: image-asset
severity: major
source_of_truth: ooxml
verification:
  method: object_compare
  selector: picture
  expectation:
    exact_count: 1
    required: true
---
schema_version: "1.0"
id: slide-01.decorative-shapes
scope: slide
slide: 1
tier: 1
title: Decorative shapes with effects
description: Slide 1 should have overlapping decorative shapes with shadow and/or transparency.
kind: structure
severity: minor
source_of_truth: ooxml
verification:
  method: object_compare
  selector: shape
  expectation:
    min_count: 2
---
schema_version: "1.0"
id: slide-01.font-policy
scope: slide
slide: 1
tier: 1
title: Font policy compliance
description: All fonts on slide 1 must be from the bundled set.
kind: structure
severity: critical
source_of_truth: ooxml
verification:
  method: anti_cheat
  selector: font_policy
failure_mode:
  automatic_fail_if:
    - non_bundled_font_used
  propagation: zero_slide
