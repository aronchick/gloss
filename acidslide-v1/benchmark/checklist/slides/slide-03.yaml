schema_version: "1.0"
id: slide-03.native-table-required
scope: slide
slide: 3
tier: 1
title: Native table required
description: Slide 3 must contain exactly one native OOXML table (<a:tbl>).
kind: table
severity: critical
source_of_truth: ooxml
verification:
  method: object_compare
  selector: table
  expectation:
    exact_count: 1
    required: true
  tolerance:
    bbox_px: 2
    units: pixels_at_1920x1080
failure_mode:
  automatic_fail_if:
    - grouped_lines_and_text_used_as_table
    - raster_image_used_as_table
  propagation: zero_slide
---
schema_version: "1.0"
id: slide-03.title-placeholder
scope: slide
slide: 3
tier: 1
title: Title placeholder present
description: Slide 3 must use a native title placeholder.
kind: master-layout
severity: critical
source_of_truth: ooxml
verification:
  method: layout_check
  selector: placeholder
  expectation:
    placeholder_type: title
    min_count: 1
---
schema_version: "1.0"
id: slide-03.font-policy
scope: slide
slide: 3
tier: 1
title: Font policy compliance
description: All fonts on slide 3 must be from the bundled set.
kind: structure
severity: critical
source_of_truth: ooxml
verification:
  method: anti_cheat
  selector: font_policy
failure_mode:
  automatic_fail_if:
    - non_bundled_font_used
  propagation: zero_slide
