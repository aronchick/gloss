[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "acidslide-service"
version = "1.0.0a1"
description = "Hosted, grading-verified AcidSlide leaderboard service"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=48.0.1,<49",
  "fastapi>=0.116,<1",
  "jinja2>=3.1.6,<4",
  "jsonschema>=4.25,<5",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.2.9,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "rfc8785>=0.1.4,<1",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "lxml>=6.1,<7",
  "lxml-stubs>=0.5.1,<1",
  "mypy>=1.17,<2",
  "pip-audit>=2.10,<3",
  "playwright>=1.55,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
  "types-jsonschema>=4.25,<5",
]

[project.scripts]
acidslide-service = "acidslide_service.main:run"
acidslide-worker = "acidslide_service.worker:run"
acidslide-quarantine-worker = "acidslide_service.quarantine_worker:run"
acidslide-admin = "acidslide_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["acidslide_service"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
pythonpath = ["../grader"]

[tool.coverage.run]
branch = true
source = ["acidslide_service"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "../grader"
