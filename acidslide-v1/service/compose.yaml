name: acidslide

services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: acidslide
      POSTGRES_USER: acidslide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acidslide -d acidslide"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]
    security_opt: [no-new-privileges:true]

  api:
    build:
      context: .
      additional_contexts:
        schemas: ../schemas
      target: api
    image: acidslide/service-api:${SERVICE_VERSION:-1.0.0}
    restart: unless-stopped
    environment: &service-environment
      ACIDSLIDE_APP_ENV: production
      ACIDSLIDE_DATABASE_URL: postgresql+psycopg://acidslide:${POSTGRES_PASSWORD}@postgres/acidslide
      ACIDSLIDE_STORAGE_PATH: /data
      ACIDSLIDE_PUBLIC_BASE_URL: https://${SITE_DOMAIN:-acidslide.dev}
      ACIDSLIDE_ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
      ACIDSLIDE_API_KEY_PEPPER: ${API_KEY_PEPPER:?set API_KEY_PEPPER}
      ACIDSLIDE_ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      ACIDSLIDE_TRUSTED_HOSTS: ${SITE_DOMAIN:-acidslide.dev},${API_DOMAIN:-api.acidslide.dev},localhost
      ACIDSLIDE_GRADER_IMAGE: ${GRADER_IMAGE:-acidslide/grader:1.0.0}
      ACIDSLIDE_GRADER_IMAGE_DIGEST: ${GRADER_IMAGE_DIGEST:?pin GRADER_IMAGE_DIGEST}
      ACIDSLIDE_LIBREOFFICE_VERSION: ${LIBREOFFICE_VERSION:?set LIBREOFFICE_VERSION}
      ACIDSLIDE_FONT_BUNDLE_HASH: ${FONT_BUNDLE_HASH:?set FONT_BUNDLE_HASH}
      ACIDSLIDE_ASSET_MANIFEST_HASH: ${ASSET_MANIFEST_HASH:?set ASSET_MANIFEST_HASH}
      ACIDSLIDE_ACTIVE_SCORING_MANIFEST_SHA256: ${ACTIVE_SCORING_MANIFEST_SHA256:?set ACTIVE_SCORING_MANIFEST_SHA256}
      ACIDSLIDE_ACTIVE_GRADER_SOURCE_TREE_SHA256: ${ACTIVE_GRADER_SOURCE_TREE_SHA256:?set ACTIVE_GRADER_SOURCE_TREE_SHA256}
      ACIDSLIDE_ACTIVE_ENVIRONMENT_ATTESTATION_SHA256: ${ACTIVE_ENVIRONMENT_ATTESTATION_SHA256:?set ACTIVE_ENVIRONMENT_ATTESTATION_SHA256}
      ACIDSLIDE_ENVIRONMENT_ATTESTATION_JSON: ${ENVIRONMENT_ATTESTATION_JSON:?set ENVIRONMENT_ATTESTATION_JSON}
      ACIDSLIDE_ACTIVE_GRADER_PACKAGE_SHA256: ${ACTIVE_GRADER_PACKAGE_SHA256:?set ACTIVE_GRADER_PACKAGE_SHA256}
      ACIDSLIDE_ACTIVE_PROMPT_BUNDLE_SHA256: ${ACTIVE_PROMPT_BUNDLE_SHA256:?set ACTIVE_PROMPT_BUNDLE_SHA256}
      ACIDSLIDE_ACTIVE_SCORED_ASSERTION_INVENTORY_SHA256: ${ACTIVE_SCORED_ASSERTION_INVENTORY_SHA256:?set ACTIVE_SCORED_ASSERTION_INVENTORY_SHA256}
      ACIDSLIDE_ACTIVE_CHECKLIST_BUNDLE_SHA256: ${ACTIVE_CHECKLIST_BUNDLE_SHA256:?set ACTIVE_CHECKLIST_BUNDLE_SHA256}
      ACIDSLIDE_ACTIVE_QUARANTINE_PROFILE_SHA256: ${ACTIVE_QUARANTINE_PROFILE_SHA256:?set ACTIVE_QUARANTINE_PROFILE_SHA256}
      ACIDSLIDE_ACTIVE_MCE_PROFILE_SHA256: ${ACTIVE_MCE_PROFILE_SHA256:?set ACTIVE_MCE_PROFILE_SHA256}
      ACIDSLIDE_ACTIVE_SCHEMA_BUNDLE_SHA256: ${ACTIVE_SCHEMA_BUNDLE_SHA256:?set ACTIVE_SCHEMA_BUNDLE_SHA256}
      ACIDSLIDE_ACTIVE_SCHEMA_ROOT_MAP_SHA256: ${ACTIVE_SCHEMA_ROOT_MAP_SHA256:?set ACTIVE_SCHEMA_ROOT_MAP_SHA256}
      ACIDSLIDE_ACTIVE_CANONICAL_PACKAGE_HASH_PROFILE_SHA256: ${ACTIVE_CANONICAL_PACKAGE_HASH_PROFILE_SHA256:?set ACTIVE_CANONICAL_PACKAGE_HASH_PROFILE_SHA256}
      ACIDSLIDE_ACTIVE_GOLD_BYTE_SHA256: ${ACTIVE_GOLD_BYTE_SHA256:?set ACTIVE_GOLD_BYTE_SHA256}
      ACIDSLIDE_ACTIVE_GOLD_MCE_RESOLVED_PACKAGE_SHA256: ${ACTIVE_GOLD_MCE_RESOLVED_PACKAGE_SHA256:?set ACTIVE_GOLD_MCE_RESOLVED_PACKAGE_SHA256}
      ACIDSLIDE_ACTIVE_GOLD_CANONICAL_PACKAGE_SHA256: ${ACTIVE_GOLD_CANONICAL_PACKAGE_SHA256:?set ACTIVE_GOLD_CANONICAL_PACKAGE_SHA256}
      ACIDSLIDE_SCORING_MANIFEST_PATH: /opt/acidslide/benchmark/scoring-manifest.json
      ACIDSLIDE_GOLD_EVIDENCE_PATH: /opt/acidslide/benchmark/gold-evidence.json
      ACIDSLIDE_GOLD_RESOLVED_PATH: /opt/acidslide/benchmark/deck/gold/acidslide-v1-gold.mce-resolved.pptx
      ACIDSLIDE_CONTROL_HANDOFF_SCHEMA_PATH: /opt/acidslide/schemas/control-handoff.schema.json
      ACIDSLIDE_CONTROL_VERIFICATION_KEYS_JSON: ${CONTROL_VERIFICATION_KEYS_JSON:?set CONTROL_VERIFICATION_KEYS_JSON}
      ACIDSLIDE_DRIFT_CANARY_MAX_AGE_SECONDS: ${DRIFT_CANARY_MAX_AGE_SECONDS:-691200}
      ACIDSLIDE_QUARANTINE_IMAGE: ${QUARANTINE_IMAGE:-acidslide/quarantine:1.0.0}
      ACIDSLIDE_QUARANTINE_IMAGE_DIGEST: ${QUARANTINE_IMAGE_DIGEST:?pin QUARANTINE_IMAGE_DIGEST}
      ACIDSLIDE_QUARANTINE_VERIFICATION_KEYS_JSON: ${QUARANTINE_VERIFICATION_KEYS_JSON:?set QUARANTINE_VERIFICATION_KEYS_JSON}
      ACIDSLIDE_METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?set METRICS_BEARER_TOKEN}
    volumes:
      - private-storage:/data
      - ../benchmark/scoring-manifest.json:/opt/acidslide/benchmark/scoring-manifest.json:ro
      - ../benchmark/gold-evidence.json:/opt/acidslide/benchmark/gold-evidence.json:ro
      - ../benchmark/deck/gold/acidslide-v1-gold.mce-resolved.pptx:/opt/acidslide/benchmark/deck/gold/acidslide-v1-gold.mce-resolved.pptx:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private, edge]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  worker:
    build:
      context: .
      additional_contexts:
        schemas: ../schemas
      target: worker
    image: acidslide/service-worker:${SERVICE_VERSION:-1.0.0}
    command: ["acidslide-worker"]
    restart: unless-stopped
    environment: *service-environment
    volumes:
      - private-storage:/data
      - ../benchmark/scoring-manifest.json:/opt/acidslide/benchmark/scoring-manifest.json:ro
      - ../benchmark/gold-evidence.json:/opt/acidslide/benchmark/gold-evidence.json:ro
      - ../benchmark/deck/gold/acidslide-v1-gold.mce-resolved.pptx:/opt/acidslide/benchmark/deck/gold/acidslide-v1-gold.mce-resolved.pptx:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - ${DOCKER_GID:?set DOCKER_GID}
    depends_on:
      api:
        condition: service_healthy
    networks: [private, outbound]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  quarantine:
    build:
      context: .
      additional_contexts:
        schemas: ../schemas
      target: worker
    image: acidslide/service-worker:${SERVICE_VERSION:-1.0.0}
    command: ["acidslide-quarantine-worker"]
    restart: unless-stopped
    environment:
      <<: *service-environment
      ACIDSLIDE_QUARANTINE_SIGNING_KEY_ID: ${QUARANTINE_SIGNING_KEY_ID:?set QUARANTINE_SIGNING_KEY_ID}
      ACIDSLIDE_QUARANTINE_SIGNING_PRIVATE_KEY: ${QUARANTINE_SIGNING_PRIVATE_KEY:?set QUARANTINE_SIGNING_PRIVATE_KEY}
    volumes:
      - private-storage:/data
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - ${DOCKER_GID:?set DOCKER_GID}
    depends_on:
      api:
        condition: service_healthy
    networks: [private]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-acidslide.dev}
      API_DOMAIN: ${API_DOMAIN:-api.acidslide.dev}
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    networks: [edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

networks:
  edge:
  private:
    internal: true
  outbound:

volumes:
  postgres-data:
  private-storage:
  caddy-data:
  caddy-config:
