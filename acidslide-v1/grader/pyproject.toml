[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acidslide"
version = "1.0.0a1"
description = "AcidSlide benchmark grader — ECMA-376 slide generation fidelity testing"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "lxml>=5.0",
    "Pillow>=10.0",
    "numpy>=1.26",
    "scikit-image>=0.22",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
acidslide = "acidslide.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
